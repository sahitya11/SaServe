<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="saServeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="saServeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="36" fill="#090d16" />

  <!-- Clean Vertical Top-to-Bottom S-Loop (Shifted well above typography) -->
  <g transform="translate(250, 160)" filter="url(#saServeGlow)">
    <path d="M 0,-95 
             C 55,-95 75,-48 35,-15 
             C 2,-3 -2,3 -35,15 
             C -75,48 -55,95 0,95 
             C 55,95 75,48 35,15 
             C 2,3 -2,-3 -35,-15 
             C -75,-48 -55,-95 0,-95 Z" 
          fill="none" 
          stroke="url(#saServeGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Streamline Orbital Nodes -->
    <circle cx="0" cy="-95" r="7" fill="#2563eb" />
    <circle cx="0" cy="95" r="7" fill="#06b6d4" />
  </g>

  <!-- Typography -->
  <text x="250" y="380" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
    SaServe
  </text>
  <text x="250" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#06b6d4" letter-spacing="2" text-transform="uppercase">
    Connecting You with Trusted Services
  </text>
</svg>
